<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Contact Us</title>
</head>
 
<body>
    <a href="/FUTURE_FS_02/admin.html">
    <button>Open CRM Admin Panel</button>
    </a>
    <div class="container">
        <h1>Get in Touch</h1>
        <p>Fill out this form, and our sales team will reach out shortly.</p>
        <form id="contactForm">
            <label>Name</label>
            <input type="text" id="name" required>
            
            <label>Email Address</label>
            <input type="email" id="email" required>
            
            <label>Message / Requirements</label>
            <textarea id="message" rows="4" required></textarea>
            
            <button type="submit">Submit Request</button>
        </form>
        <p id="formFeedback" style="color: green; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };
            const response = await fetch('/api/leads', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                document.getElementById('formFeedback').innerText = "Thank you! We'll be in touch.";
                document.getElementById('contactForm').reset();
            }
        });
    </script>
</body>
</html>
